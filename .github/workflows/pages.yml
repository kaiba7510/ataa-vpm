# 説明書サイト（docs/）をビルドし、VPM リスティング（index.json）と zip と一緒に GitHub Pages へ公開する。
# リスティングの URL（https://kaiba7510.github.io/ataa-vpm/index.json）と zip の URL は今までと変わらない。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 最終更新日のため
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - name: リスティングと zip をサイトに並べる
        run: |
          out=docs/.vitepress/dist
          cp index.json "$out/"
          cp *.zip "$out/"
          touch "$out/.nojekyll"
          # 念のため、リスティングが載っていることを確かめる
          test -s "$out/index.json"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
